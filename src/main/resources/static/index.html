<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Spring Boot Demo</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:50px auto;padding:0 18px;color:#243043}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd5df;padding:12px;text-align:left}th{background:#eef4fa}</style></head><body><h1>Inventory Management</h1><p>Spring Boot REST API demo</p><table><thead><tr><th>ID</th><th>Item</th><th>Quantity</th></tr></thead><tbody id="items"></tbody></table><p><a href="api/inventory">View JSON API</a></p><script>fetch('api/inventory').then(r=>r.json()).then(items=>{document.getElementById('items').innerHTML=items.map(i=>`<tr><td>${i.id}</td><td>${i.item}</td><td>${i.quantity}</td></tr>`).join('')}).catch(()=>{document.getElementById('items').textContent='Unable to load inventory.'})</script></body></html>
